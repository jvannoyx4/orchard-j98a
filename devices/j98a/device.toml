# iPad Pro 12.9-inch (Wi-Fi) (J98a): native RAM boot measured on 2026-11-20.
# Companion kernel and boot evidence: devices/j98a/README.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j98a"
name = "iPad Pro 12.9-inch (Wi-Fi)"
apple_products = ["iPad6,7"]
dt_compatible = ["apple,j98a"]

[match.dfu]
chip = 0x8001
board = 0x10

[boot]
methods = ["checkm8-pongo"] # checkra1n, Hoolock Pongo and Orchard RAM boot tested.

[kernel]
platform = "apple-16k"
dtb = "s8001-j98a" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # See the J98a port notes for the measured firmware variants.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml). Working states below
# describe the measured companion-kernel RAM boot, not a persistent installation.
[features]
display = "working"
screen_off = "missing"
backlight = "working" # Visible dim/restore measured in the RAM session.
touch = "missing" # Firmware and stock-speed D3 descriptor passed; no input device yet.
buttons = "working" # Press/release measured for Volume Up/Down, Home and Power.
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "working" # Raw ALS responds to covering; second exposes lux.
touch_id = "missing"
storage_read = "missing"
storage_write = "missing"
wifi = "working" # WPA2, DHCP and gateway/Internet traffic passed over wlan0.
bluetooth_input = "untested" # Powered managed adapter passes; pairing/input untested.
bluetooth_audio = "untested" # Powered adapter exists; audio connection untested.
cellular = "none"
battery = "working"
charging = "missing"
charging_control = "missing"
suspend = "untested"
resume = "untested"
usb_serial = "working"
usb_network = "working"
usb_host = "missing"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
